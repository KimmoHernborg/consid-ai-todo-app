<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Task List</h1>
        <form id="add-form">
            <input
                type="text"
                id="task-input"
                placeholder="Add a new task..."
                autocomplete="off"
                required
            >
            <button type="submit">Add</button>
        </form>
        <ul id="task-list"></ul>
    </main>
    <script src="app.js"></script>
</body>
</html>
